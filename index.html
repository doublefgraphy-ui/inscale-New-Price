<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>INSCALE SHOWROOM</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body id="top">
  <header class="topbar">
    <button class="brand-home" id="homeBtn" type="button" aria-label="맨 위로 이동">
      <span class="eyebrow">INSCALE SHOWROOM</span>
      <span class="title">DISPLAY SALE &amp; STOCK</span>
    </button>
    <button id="resetBtn" class="reset-btn" type="button">초기화</button>
  </header>

  <main class="wrap">
    <section class="search-panel">
      <nav class="mode-tabs" aria-label="메인 카테고리">
        <button class="mode-btn is-active" type="button" data-mode="sale">DISPLAY SALE</button>
        <button class="mode-btn saarinen" type="button" data-mode="saarinen">SAARINEN 재고&amp;입항</button>
      </nav>

      <input id="searchInput" type="search"
        placeholder="상품명, 브랜드, 디자이너, 소재 검색"
        autocomplete="off">

      <nav id="floorTabs" class="floor-tabs" aria-label="층별 필터"></nav>

      <nav id="saarinenTabs" class="saarinen-tabs" aria-label="사리넨 재고 필터" hidden></nav>

      <div class="summary">
        <span id="countText">불러오는 중...</span>
        <span id="hintText" class="hint">전시 제품은 상태를 확인 후 구매해 주세요.</span>
      </div>
    </section>

    <section id="productList" class="product-list"></section>
    <section id="saarinenList" class="saarinen-list" hidden></section>
    <section id="emptyState" class="empty-state" hidden>검색 결과가 없습니다.</section>
  </main>

  <footer class="footer"><p>INSCALE SHOWROOM</p></footer>
  <script src="script.js?v=5"></script>
</body>
</html>
