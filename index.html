<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6f3" />
  <title>INSCALE SHOWROOM · PRICE & SPEC</title>
  <link rel="stylesheet" href="style.css?v=20260928-2" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="brand" id="homeBtn" aria-label="맨 위로">
<img class="brand-logo" src="inscale-logo.svg?v=2" alt="INSCALE" />
      </button>
      <div class="header-meta">
        <span class="private-note">INTERNAL SHOWROOM CATALOG</span>
        <button class="reset" id="resetBtn">RESET</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <div>
          <p class="hero-kicker">INSCALE SHOWROOM</p>
          <h1>Display Collection</h1>
          <p class="hero-copy">층별 전시 제품의 가격과 스펙을 빠르게 확인하세요.</p>
        </div>
        <div class="hero-stats" aria-label="카탈로그 요약">
          <div><strong id="statProducts">—</strong><span>PRODUCTS</span></div>
          <div><strong id="statBrands">—</strong><span>BRANDS</span></div>
          <div><strong>5</strong><span>FLOORS</span></div>
        </div>
      </div>
    </section>

    <section class="toolbar-wrap">
      <div class="toolbar">
        <nav class="tabs" id="floorTabs" aria-label="층별 필터">
          <button class="tab is-active" data-mode="all"><span class="dot"></span>ALL <b id="countAll">0</b></button>
          <button class="tab" data-mode="floor" data-floor="B1"><span class="dot"></span>B1 <b id="countB1">0</b></button>
          <button class="tab" data-mode="floor" data-floor="1F"><span class="dot"></span>1F <b id="count1F">0</b></button>
          <button class="tab" data-mode="floor" data-floor="2F"><span class="dot"></span>2F <b id="count2F">0</b></button>
          <button class="tab" data-mode="floor" data-floor="3F"><span class="dot"></span>3F <b id="count3F">0</b></button>
          <button class="tab" data-mode="floor" data-floor="4F"><span class="dot"></span>4F <b id="count4F">0</b></button>
          <button class="tab sale" data-mode="sale"><span class="dot"></span>DP SALE <b id="countSale">0</b></button>
        </nav>
        <label class="search">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="제품명, 브랜드, 디자이너, 소재 검색" autocomplete="off" />
        </label>
      </div>
    </section>

    <section class="catalog-wrap">
      <div class="catalog-head">
        <div>
          <p class="catalog-eyebrow" id="catalogEyebrow">ALL DISPLAY</p>
          <h2 id="catalogTitle">All Products</h2>
        </div>
        <p class="result-count" id="resultCount">불러오는 중...</p>
      </div>
      <div id="brandSections"></div>
      <div class="empty" id="emptyState" hidden>조건에 맞는 제품이 없습니다.</div>
    </section>
  </main>

  <footer>
    <span>INSCALE</span>
    <span>Internal showroom catalog</span>
  </footer>

  <div class="gallery-modal" id="galleryModal" hidden>
    <div class="gallery-backdrop" data-close-gallery></div>
    <article class="gallery-panel" role="dialog" aria-modal="true" aria-labelledby="galleryName">
      <button class="gallery-close" data-close-gallery aria-label="닫기">×</button>
      <div class="gallery-head">
        <span id="galleryBrand"></span>
        <h2 id="galleryName"></h2>
      </div>
      <div class="gallery-stage">
        <button class="gallery-arrow prev" id="galleryPrev" aria-label="이전 이미지">‹</button>
        <img id="galleryImage" src="" alt="" />
        <button class="gallery-arrow next" id="galleryNext" aria-label="다음 이미지">›</button>
      </div>
      <div class="gallery-count" id="galleryCount"></div>
    </article>
  </div>

  <script src="script.js?v=20260928-2"></script>
</body>
</html>
